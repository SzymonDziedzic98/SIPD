# Publikuje katalog web/ (sipd.py + index.html) na GitHub Pages.
# Wymaga: Settings -> Pages -> Source: "GitHub Actions".
name: Strona SIPD (GitHub Pages)

on:
  push:
    branches: [main, feature/gamadays-compat]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Testy modelu (python web/sipd.py --test)
        run: python3 web/sipd.py --test
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
